<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Problems — Math Playground</title>
<link rel="stylesheet" href="math.css">
<script src="math.js"></script>
</head>
<body>

<header class="site-head"></header>

<main>
  <h1>Story Problems</h1>
  <p class="hero-tagline">Short picture stories with a bar model showing what is
    happening. The two parts make the whole.</p>

  <section class="setup" id="setupBar" aria-labelledby="setupTitle">
    <p class="setup-title" id="setupTitle">What should we practice?</p>
    <div class="setup-row">
      <span class="setup-label" id="gradeLabel">Grade level</span>
      <div class="setup-row" id="gradeRow" role="group" aria-labelledby="gradeLabel"></div>
    </div>
    <div class="setup-row">
      <span class="setup-label" id="opLabel">Math operations</span>
      <div class="setup-row" id="opRow" role="group" aria-labelledby="opLabel"></div>
    </div>
    <p class="setup-note" id="setupNote"></p>
  </section>

  <section class="game-stage" aria-label="Story Problems game">
    <p class="prompt-line" id="prompt"></p>
    <div class="visual" id="visual"></div>
    <div class="problem" id="problem"></div>
    <div class="choices" id="choices"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <p class="hint-line" id="hint" hidden></p>
    <div class="stage-actions" id="actions"></div>
    <div class="progress" id="progress"></div>
    <p class="progress-label" id="progressLabel"></p>
  </section>
</main>

<footer class="site-foot"></footer>

<script>
  'use strict';

  let game = null;

  renderSetup({
    only: GAME_OPS.story,
    note: gameNote('story'),
    onChange: () => { if (game) game.refresh(); }
  });

  const NAMES = ['Maya', 'Sam', 'Leo', 'Ana', 'Ben'];

  /* Small flat icons, drawn in the palette's own colors. */
  const ICONS = {
    apple: '<circle cx="16" cy="19" r="10.5" fill="var(--accent)"/>' +
      '<rect x="14.7" y="5" width="2.6" height="7" rx="1.3" fill="var(--text)"/>' +
      '<path d="M17.5 8.5c1.6-3 4.6-4 7.2-3.4.4 3-1.7 6-5.2 6.6z" fill="var(--accent2)"/>',
    cookie: '<circle cx="16" cy="16" r="11" fill="var(--accent2)"/>' +
      '<circle cx="12" cy="13" r="2" fill="var(--surface)"/>' +
      '<circle cx="19.5" cy="12.5" r="1.7" fill="var(--surface)"/>' +
      '<circle cx="17" cy="19.5" r="2.2" fill="var(--surface)"/>' +
      '<circle cx="11" cy="20" r="1.6" fill="var(--surface)"/>',
    box: '<rect x="4" y="11" width="24" height="16" rx="2.5" fill="var(--accent)"/>' +
      '<path d="M4 17.5h24" stroke="var(--surface)" stroke-width="2.5"/>' +
      '<path d="M16 11v6.5" stroke="var(--surface)" stroke-width="2.5"/>' +
      '<path d="M9.5 11 12.5 6h7l3 5" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linejoin="round"/>',
    bag: '<path d="M8 12h16l-2 15H10z" fill="var(--accent2)"/>' +
      '<path d="M12 12V9a4 4 0 0 1 8 0v3" fill="none" stroke="var(--text)" stroke-width="2.4"/>'
  };

  function icon(kind) {
    return '<svg viewBox="0 0 32 32" aria-hidden="true">' + ICONS[kind] + '</svg>';
  }

  function sentence(p, name) {
    if (p.op === 'add') {
      return name + ' had ' + p.a + ' apples and picked ' + p.b +
        ' more. How many apples does ' + name + ' have now?';
    }
    if (p.op === 'sub') {
      return 'There were ' + p.a + ' cookies on the plate. ' + name +
        ' ate ' + p.b + '. How many cookies are left?';
    }
    if (p.op === 'mul') {
      return 'There are ' + p.a + ' boxes. Each box holds ' + p.b +
        ' stickers. How many stickers are there altogether?';
    }
    return p.a + ' stickers are shared equally into ' + p.b +
      ' bags. How many stickers are in each bag?';
  }

  function sceneParts(p) {
    if (p.op === 'add') {
      return [{ icon: 'apple', text: String(p.a) }, { op: '+' },
              { icon: 'apple', text: String(p.b) }];
    }
    if (p.op === 'sub') {
      return [{ icon: 'cookie', text: String(p.a) }, { op: '\u2212' },
              { icon: 'cookie', text: String(p.b) }];
    }
    if (p.op === 'mul') {
      return [{ icon: 'box', text: p.a + ' boxes' }, { op: '\u00D7' },
              { icon: 'box', text: p.b + ' each' }];
    }
    return [{ icon: 'bag', text: p.a + ' stickers' }, { op: '\u00F7' },
            { icon: 'bag', text: p.b + ' bags' }];
  }

  /* Bar model rows: top = the whole, bottom = the parts.
     Widths are proportional, so the picture matches the numbers. */
  function modelRows(p) {
    if (p.op === 'add') {
      return [
        [{ label: '?', grow: p.answer, cls: 'whole' }],
        [{ label: String(p.a), grow: p.a, cls: 'part1' },
         { label: String(p.b), grow: p.b, cls: 'part2' }]
      ];
    }
    if (p.op === 'sub') {
      return [
        [{ label: String(p.a), grow: p.a, cls: 'whole' }],
        [{ label: String(p.b), grow: p.b, cls: 'part1' },
         { label: '?', grow: p.answer, cls: 'unknown' }]
      ];
    }
    if (p.op === 'mul') {
      const parts = [];
      for (let i = 0; i < p.a; i++) {
        parts.push({ label: String(p.b), grow: p.b, cls: i % 2 ? 'part2' : 'part1' });
      }
      return [[{ label: '?', grow: p.answer, cls: 'whole' }], parts];
    }
    const parts = [];
    for (let i = 0; i < p.b; i++) {
      parts.push({ label: '?', grow: p.answer, cls: 'unknown' });
    }
    return [[{ label: String(p.a), grow: p.a, cls: 'whole' }], parts];
  }

  function drawStory(p, box) {
    const name = NAMES[randInt(0, NAMES.length - 1)];

    const text = document.createElement('p');
    text.className = 'story-text';
    text.textContent = sentence(p, name);
    box.appendChild(text);

    const scene = document.createElement('div');
    scene.className = 'story-scene';
    for (const part of sceneParts(p)) {
      const chip = document.createElement('div');
      chip.className = 'scene-icon';
      if (part.op) {
        chip.classList.add('op-chip');
        chip.textContent = part.op;
        chip.setAttribute('aria-hidden', 'true');
      } else {
        chip.innerHTML = icon(part.icon) +
          '<span>' + part.text + '</span>';
      }
      scene.appendChild(chip);
    }
    box.appendChild(scene);

    const model = document.createElement('div');
    model.className = 'bar-model';
    const cap = document.createElement('p');
    cap.className = 'model-caption';
    cap.textContent = 'Bar model \u2014 the ? is what we need';
    model.appendChild(cap);
    for (const rowParts of modelRows(p)) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      for (const rp of rowParts) {
        const bar = document.createElement('div');
        bar.className = 'bar ' + rp.cls;
        bar.style.flexGrow = String(rp.grow);
        bar.textContent = rp.label;
        row.appendChild(bar);
      }
      model.appendChild(row);
    }
    box.appendChild(model);
  }

  game = initGame({
    id: 'story',
    page: 'story.html',
    ops: GAME_OPS.story,
    choiceMode: true,
    equation: 'after',
    prompt: () => 'Read the story, then choose the answer.',
    hintFor: (p) => {
      if (p.op === 'add') {
        return 'The bar model shows two parts. Put them together to make the whole.';
      }
      if (p.op === 'sub') {
        return 'The whole is ' + p.a + '. One part is ' + p.b +
          '. What is the other part?';
      }
      if (p.op === 'mul') {
        return p.a + ' equal parts of ' + p.b + '. Count by ' + p.b +
          's, ' + p.a + ' times.';
      }
      return 'Share ' + p.a + ' into ' + p.b +
        ' equal parts. Every part is the same size.';
    },
    render: drawStory
  });
</script>
</body>
</html>
