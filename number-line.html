<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Line — Math Playground</title>
<link rel="stylesheet" href="math.css">
<script src="math.js"></script>
</head>
<body>

<header class="site-head"></header>

<main>
  <h1>Number Line</h1>
  <p class="hero-tagline">Drag the hopper, or tap the big + and &minus; buttons. The badge
    above it shows how far you have moved from the start. Land on the answer and the
    hopper goes see-through while a magnifier shows the number up close.</p>

  <section class="setup" id="setupBar" aria-labelledby="setupTitle">
    <p class="setup-title" id="setupTitle">What should we practice?</p>
    <div class="setup-row">
      <span class="setup-label" id="gradeLabel">Grade level</span>
      <div class="setup-row" id="gradeRow" role="group" aria-labelledby="gradeLabel"></div>
    </div>
    <div class="setup-row">
      <span class="setup-label" id="opLabel">Math operations</span>
      <div class="setup-row" id="opRow" role="group" aria-labelledby="opLabel"></div>
    </div>
    <p class="setup-note" id="setupNote"></p>
  </section>

  <section class="game-stage" aria-label="Number Line game">
    <p class="prompt-line" id="prompt"></p>
    <div class="visual" id="visual"></div>
    <div class="problem" id="problem"></div>
    <div class="choices" id="choices"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <p class="hint-line" id="hint" hidden></p>
    <div class="stage-actions" id="actions"></div>
    <div class="progress" id="progress"></div>
    <p class="progress-label" id="progressLabel"></p>
  </section>
</main>

<footer class="site-foot"></footer>

<script>
  'use strict';

  let gameApi = null;
  let nl = null;                 // state for this problem
  let svg = null, arcG = null, hopG = null;
  let badgeG = null, badgeRect = null, badgeText = null;
  let lensG = null, lensNum = null, lensHandle = null;
  let caption = null, minusBtn = null, plusBtn = null;
  let answered = false;

  const NS = 'http://www.w3.org/2000/svg';
  /* Taller than the line itself: the magnifier floats in the space above
     it, with room to clear both the badge and the start number. */
  const W = 560, H = 204, PAD = 26, YB = 150;
  const LENS_R = 32;              // magnifier radius
  const LENS_UP = 82;             // how far above the line it floats

  renderSetup({
    only: GAME_OPS.line,
    note: gameNote('line'),
    onChange: () => { if (gameApi) gameApi.refresh(); }
  });

  function s(tag, attrs, text) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function xOf(v) { return PAD + (v * (W - PAD * 2)) / nl.cap; }

  /* ---------- Problem setup ---------- */

  function makeNl(p) {
    const hi = p.op === 'div' ? p.a : Math.max(p.a, p.answer);
    const cap = Math.max(10, Math.ceil(hi / 10) * 10);
    const start = (p.op === 'add' || p.op === 'sub') ? p.a : 0;
    const jump = p.op === 'mul' ? Math.max(p.a, p.b)
               : p.op === 'div' ? p.b
               : 1;
    /* The line stops at the answer for division (you can't jump past
       the dividend) and lets multiplication overshoot one jump. */
    const maxPos = p.op === 'div' ? p.a
                 : p.op === 'mul' ? Math.floor(cap / jump) * jump
                 : cap;
    return {
      p: p, cap: cap, start: start, pos: start, jump: jump, maxPos: maxPos,
      jumpsTarget: p.op === 'mul' ? Math.min(p.a, p.b) : 0
    };
  }

  function targetPos(n) {
    const p = n.p;
    if (p.op === 'add') return n.start + p.b;
    if (p.op === 'sub') return n.start - p.b;
    if (p.op === 'mul') return p.answer;
    return p.a;                       // division: reach the dividend
  }

  function atTarget() { return nl && nl.pos === targetPos(nl); }

  function snap(v) {
    let r = Math.round(v / nl.jump) * nl.jump;
    if (r < 0) r = 0;
    if (r > nl.maxPos) r = nl.maxPos;
    return r;
  }

  /* How far the hopper has moved from the start: "+7", "−3" or "0". */
  function distText() {
    const d = nl.pos - nl.start;
    if (d > 0) return '+' + d;
    if (d < 0) return '\u2212' + (-d);
    return '0';
  }

  function statusText() {
    const p = nl.p;
    const dist = distText();
    if (atTarget()) {
      if (p.op === 'div') {
        return 'You\u2019re at ' + nl.pos + '. How many jumps was that?';
      }
      return 'You\u2019ve moved ' + dist + '. Which number did you land on?';
    }
    if (p.op === 'add') {
      return 'Hop +' + p.b + ' from ' + p.a + '. You\u2019ve moved ' + dist + '.';
    }
    if (p.op === 'sub') {
      return 'Hop \u2212' + p.b + ' from ' + p.a + '. You\u2019ve moved ' + dist + '.';
    }
    if (p.op === 'mul') {
      const taken = Math.round(nl.pos / nl.jump);
      return 'Take ' + nl.jumpsTarget + ' jumps of ' + nl.jump +
        '. You\u2019ve taken ' + taken + '.';
    }
    return 'Jump by ' + p.b + ' until you reach ' + p.a +
      '. You\u2019re at ' + nl.pos + '.';
  }

  function captionFor(p) {
    if (p.op === 'add') return 'Jump: +' + p.b;
    if (p.op === 'sub') return 'Jump: \u2212' + p.b;
    if (p.op === 'mul') return Math.min(p.a, p.b) + ' jumps of ' + Math.max(p.a, p.b);
    return 'Jumps of ' + p.b;
  }

  function hintFor(p) {
    if (p.op === 'add') {
      return 'Press + until the badge shows +' + p.b +
        ', then read the number under the hopper.';
    }
    if (p.op === 'sub') {
      return 'Press \u2212 until the badge shows \u2212' + p.b +
        ', then read the number under the hopper.';
    }
    if (p.op === 'mul') {
      return 'Press + ' + Math.min(p.a, p.b) + ' times \u2014 one jump of ' +
        Math.max(p.a, p.b) + ' each \u2014 then read where you land.';
    }
    return 'Press + until the badge shows +' + p.a +
      '. Count your jumps as you go.';
  }

  /* ---------- Drawing ---------- */

  function hopPath(x1, x2, lift) {
    const dx = (x2 - x1) / 4;
    return 'M ' + x1 + ' ' + (YB - 10) +
      ' C ' + (x1 + dx) + ' ' + lift + ', ' + (x2 - dx) + ' ' + lift +
      ', ' + x2 + ' ' + (YB - 10);
  }

  function hopButton(glyph, label, dir) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn hop-btn';
    b.textContent = glyph;
    b.setAttribute('aria-label', label);
    b.title = label;
    b.addEventListener('click', () => move(dir));
    return b;
  }

  /* A little magnifying glass: a zoomed-in look at the number the hopper
     is sitting on. Built once per problem, shown by update(). */
  function buildLens() {
    const g = s('g', { class: 'line-lens' });

    /* handle first, so the ring covers where it meets the glass */
    g.appendChild(s('line', {
      class: 'lens-handle', x1: 0, y1: LENS_R, x2: 0, y2: LENS_R + 22
    }));
    g.appendChild(s('circle', { cx: 0, cy: 0, r: LENS_R, class: 'lens-ring' }));

    /* what you see through it: the number, big, resting on the line */
    g.appendChild(s('text', {
      x: 0, y: 0, class: 'lens-num', 'text-anchor': 'middle'
    }, '0'));
    g.appendChild(s('line', { x1: -20, y1: 14, x2: 20, y2: 14, class: 'lens-base' }));
    g.appendChild(s('line', { x1: -13, y1: 14, x2: -13, y2: 21, class: 'lens-tick' }));
    g.appendChild(s('line', { x1: 13, y1: 14, x2: 13, y2: 21, class: 'lens-tick' }));
    g.appendChild(s('line', { x1: 0, y1: 14, x2: 0, y2: 24, class: 'lens-tick mid' }));
    return g;
  }

  function drawLine(p, box, api) {
    gameApi = api;
    answered = false;
    nl = makeNl(p);

    const labelStep = nl.cap <= 20 ? 1 : nl.cap <= 50 ? 5 : 10;
    svg = s('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      role: 'img',
      'aria-label': captionFor(p)
    });

    svg.appendChild(s('line', {
      x1: xOf(0), y1: YB, x2: xOf(nl.cap), y2: YB, class: 'line-base'
    }));
    for (let v = 0; v <= nl.cap; v++) {
      const major = v % labelStep === 0;
      svg.appendChild(s('line', {
        x1: xOf(v), y1: YB, x2: xOf(v), y2: YB + (major ? 14 : 7),
        class: 'line-tick ' + (major ? 'major' : 'minor')
      }));
      if (major) {
        svg.appendChild(s('text', {
          x: xOf(v), y: YB + 34, class: 'line-num', 'text-anchor': 'middle'
        }, String(v)));
      }
    }

    /* where the hopper started */
    if (p.op === 'add' || p.op === 'sub') {
      svg.appendChild(s('text', {
        x: xOf(nl.start), y: YB - 30, class: 'line-hnum', 'text-anchor': 'middle'
      }, String(p.a)));
    }

    arcG = s('g', {});
    svg.appendChild(arcG);

    /* the hopper + a generous invisible grab area for touch */
    hopG = s('g', { transform: 'translate(' + xOf(nl.pos) + ',' + YB + ')' });
    hopG.appendChild(s('circle', { cx: 0, cy: 0, r: 22, class: 'hop-hit' }));
    hopG.appendChild(s('circle', { cx: 0, cy: 0, r: 9, class: 'line-hopper' }));
    svg.appendChild(hopG);

    /* the little +/- badge: how far from the start */
    badgeG = s('g', { class: 'line-badge' });
    badgeRect = s('rect', { x: -20, y: 0, width: 40, height: 26, rx: 13, class: 'line-badge-bg' });
    badgeText = s('text', {
      x: 0, y: 18, class: 'line-badge-t', 'text-anchor': 'middle'
    }, '0');
    badgeG.appendChild(badgeRect);
    badgeG.appendChild(badgeText);
    svg.appendChild(badgeG);

    /* the magnifier — shown by update() once the hopper is on the answer */
    lensG = buildLens();
    lensNum = lensG.querySelector('.lens-num');
    lensHandle = lensG.querySelector('.lens-handle');
    svg.appendChild(lensG);

    hopG.addEventListener('pointerdown', startHop);
    box.appendChild(svg);

    caption = document.createElement('p');
    caption.className = 'count-line';
    box.appendChild(caption);

    const btns = document.createElement('div');
    btns.className = 'hop-btns';
    minusBtn = hopButton('\u2212', 'Hop back one step', -1);
    plusBtn = hopButton('+', 'Hop forward one step', 1);
    btns.appendChild(minusBtn);
    btns.appendChild(plusBtn);
    box.appendChild(btns);

    update();
  }

  /* Repaint everything that depends on where the hopper is. */
  function update() {
    if (!nl) return;
    const p = nl.p;

    arcG.textContent = '';
    if (p.op === 'add' || p.op === 'sub') {
      if (nl.pos !== nl.start) {
        arcG.appendChild(s('path', {
          d: hopPath(xOf(nl.start), xOf(nl.pos), 8), class: 'line-arc'
        }));
      }
    } else {
      const jumps = Math.round(nl.pos / nl.jump);
      for (let i = 0; i < jumps; i++) {
        arcG.appendChild(s('path', {
          d: hopPath(xOf(i * nl.jump), xOf((i + 1) * nl.jump), 30),
          class: 'line-arc'
        }));
      }
    }

    hopG.setAttribute('transform', 'translate(' + xOf(nl.pos) + ',' + YB + ')');

    const dist = distText();
    const bw = dist.length * 9 + 18;
    badgeRect.setAttribute('x', String(-bw / 2));
    badgeRect.setAttribute('width', String(bw));
    badgeText.textContent = dist;
    const bx = Math.max(bw / 2 + 2, Math.min(W - bw / 2 - 2, xOf(nl.pos)));
    badgeG.setAttribute('transform', 'translate(' + bx + ', 6)');
    badgeG.classList.toggle('ready', atTarget());

    /* On the answer? The hopper turns see-through with an outline and the
       magnifier floats up over the number it landed on. */
    const on = atTarget();
    hopG.classList.toggle('at-answer', on);
    if (lensG) {
      lensG.classList.toggle('is-on', on);
      if (on) {
        const lx = Math.max(LENS_R + 2, Math.min(W - LENS_R - 2, xOf(nl.pos)));
        const ly = YB - LENS_UP;
        lensG.setAttribute('transform', 'translate(' + lx + ',' + ly + ')');
        lensNum.textContent = String(targetPos(nl));
        /* handle leans from the glass down to the hopper */
        const hx = xOf(nl.pos) - lx;
        const hy = YB - ly;
        const len = Math.hypot(hx, hy) || 1;
        const ux = hx / len, uy = hy / len;
        lensHandle.setAttribute('x1', (ux * (LENS_R + 1)).toFixed(1));
        lensHandle.setAttribute('y1', (uy * (LENS_R + 1)).toFixed(1));
        lensHandle.setAttribute('x2', (ux * (LENS_R + 22)).toFixed(1));
        lensHandle.setAttribute('y2', (uy * (LENS_R + 22)).toFixed(1));
      }
    }

    if (p.op === 'mul') {
      caption.textContent = captionFor(p) + ' \u2014 you\u2019ve taken ' +
        Math.round(nl.pos / nl.jump);
    } else {
      caption.textContent = captionFor(p);
    }

    minusBtn.disabled = answered || nl.pos <= 0;
    plusBtn.disabled = answered || nl.pos >= nl.maxPos;

    if (gameApi) {
      gameApi.setPrompt(statusText());
      if (!answered) gameApi.setLock(!atTarget());
    }
  }

  function move(dir) {
    if (answered || !nl) return;
    const next = snap(nl.pos + dir * nl.jump);
    if (next === nl.pos) return;
    nl.pos = next;
    update();
  }

  /* Dragging the hopper along the line. */
  function startHop(e) {
    if (answered || !nl) return;
    if (typeof e.button === 'number' && e.button !== 0) return;
    const host = e.currentTarget;
    try { host.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }

    function place(ev) {
      const rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      const scale = W / rect.width;
      const px = (ev.clientX - rect.left) * scale;
      const v = ((px - PAD) * nl.cap) / (W - PAD * 2);
      const next = snap(v);
      if (next !== nl.pos) { nl.pos = next; update(); }
    }
    function done() {
      host.removeEventListener('pointermove', place);
      host.removeEventListener('pointerup', done);
      host.removeEventListener('pointercancel', done);
    }
    host.addEventListener('pointermove', place);
    host.addEventListener('pointerup', done);
    host.addEventListener('pointercancel', done);
    place(e);
  }

  /* ---------- Runner wiring ---------- */

  const api0 = {
    id: 'line',
    page: 'number-line.html',
    ops: GAME_OPS.line,
    choiceMode: true,
    prompt: () => 'Hop along the line to find the answer.',
    hintFor: hintFor,
    lockedText: () => statusText(),
    render: drawLine,
    onCorrect: () => { answered = true; update(); },
    onReveal: () => { answered = true; update(); }
  };

  const game = initGame(api0);
  gameApi = game;
</script>
</body>
</html>
